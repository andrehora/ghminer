<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Miner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: '#FE4A60',
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
  <script src="core.js"></script>
  <script type="module">
    window._tsModulePromise = import('https://cdn.jsdelivr.net/npm/web-tree-sitter@0.26.8/web-tree-sitter.js');
  </script>
</head>

<body class="bg-white text-gray-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useCallback, useMemo, useEffect } = React;

    // ── Core (from core.js) ────────────────────────────────────────────────────────
    const {
      SOURCE_EXTENSIONS, EXT_TO_LANG, BUCKET_ORDER,
      TREE_SITTER_LANGUAGES, tsLangForPath, groupFilesByTsLang,
      parseRepoUrl, extOf, langOf, formatSize, sizeBucket,
      flattenTree, withConcurrency, analyze,
    } = window.GhMinerCore;

    const CONCURRENCY = 15;

    // ── Devicon language icons ─────────────────────────────────────────────────────
    // Build a devicon CSS class from a language/owner name by convention
    // (`devicon-<name>-plain colored`). A small alias table covers names that
    // don't match their devicon slug (c++ → cplusplus, shell → bash, etc.).
    // If devicon doesn't ship that icon, the `<i>` simply renders empty.
    const DEVICON_ALIASES = {
      'c++': 'cplusplus', cpp: 'cplusplus', 'c/c++': 'cplusplus',
      'c#': 'csharp',
      tsx: 'typescript',
      shell: 'bash',
      vue: 'vuejs',
      html: 'html5',
      css: 'css3',
      sql: 'mysql',
      golang: 'go',
      'rust-lang': 'rust',
      googlecloudplatform: 'googlecloud',
      facebookresearch: 'facebook',
      meta: 'facebook',
      amazon: 'amazonwebservices',
      aws: 'amazonwebservices',
      sveltejs: 'svelte',
      tailwindlabs: 'tailwindcss',
      yarnpkg: 'yarn',
      jenkinsci: 'jenkins',
      'rust_lang': 'rust',
    };
    function langIcon(name) {
      if (!name) return null;
      const raw = String(name).toLowerCase().trim();
      const key = DEVICON_ALIASES[raw] || raw.replace(/[^a-z0-9]/g, '');
      if (!key) return null;
      return `devicon-${key}-plain colored`;
    }
    function LangIcon({ name, className = '' }) {
      const cls = langIcon(name);
      if (!cls) return null;
      return <i className={`${cls} ${className}`} aria-hidden="true" />;
    }

    // ── Tree-sitter ────────────────────────────────────────────────────────────────

    // Cache: Parser instance per language id, plus the shared module init.
    const _tsParsers = new Map();
    let _tsInitPromise = null;

    async function getTsModule() {
      if (!_tsInitPromise) {
        _tsInitPromise = (async () => {
          const mod = await window._tsModulePromise;
          await mod.Parser.init();
          return mod;
        })();
      }
      return _tsInitPromise;
    }

    async function getParserFor(langConfig) {
      if (_tsParsers.has(langConfig.id)) return _tsParsers.get(langConfig.id);
      const { Parser, Language } = await getTsModule();
      const lang = await Language.load(langConfig.wasmUrl);
      const parser = new Parser();
      parser.setLanguage(lang);
      _tsParsers.set(langConfig.id, parser);
      return parser;
    }

    function walkNodes(tree, sources, file) {
      const cursor = tree.walk();
      let visitedChildren = false;

      while (true) {
        if (!visitedChildren) {
          if (cursor.nodeIsNamed) {
            const type = cursor.nodeType;
            if (!sources[type]) sources[type] = [];
            const curNode = cursor.currentNode;
            const rawText = curNode.text || '';
            const text = rawText.length > 200 ? rawText.slice(0, 200) : rawText;
            sources[type].push({ text, textLower: text.toLowerCase(), file, startIndex: curNode.startIndex, endIndex: curNode.endIndex });
          }
          if (cursor.gotoFirstChild()) continue;
          visitedChildren = true;
        } else if (cursor.gotoNextSibling()) {
          visitedChildren = false;
        } else if (!cursor.gotoParent()) {
          break;
        }
      }

      cursor.delete();
    }

    function summarizeNodes(sources) {
      return Object.entries(sources)
        .sort(([, a], [, b]) => b.length - a.length)
        .map(([type, arr]) => ({ type, typeLower: type.toLowerCase(), count: arr.length, sources: arr, custom: false }));
    }

    // Load custom node definitions for a language from data/<langId>_nodes.json.
    const _customNodesCache = new Map();
    async function loadCustomNodes(langId) {
      if (_customNodesCache.has(langId)) return _customNodesCache.get(langId);
      try {
        const res = await fetch(`custom_nodes/${langId}_nodes.json`);
        if (!res.ok) { _customNodesCache.set(langId, []); return []; }
        const defs = await res.json();
        _customNodesCache.set(langId, defs);
        return defs;
      } catch {
        _customNodesCache.set(langId, []);
        return [];
      }
    }

    // Parses every file whose extension is registered in TREE_SITTER_LANGUAGES,
    // grouped by language. Returns an array of { id, label, fileCount, nodes, error }.
    // A failure in one language does not prevent the others from being analyzed.
    async function analyzeTreeSitter(files) {
      const groups = groupFilesByTsLang(files);
      const results = [];
      for (const langConfig of TREE_SITTER_LANGUAGES) {
        const group = groups.get(langConfig.id);
        if (!group || group.files.length === 0) continue;
        const entry = { id: langConfig.id, label: langConfig.label, fileCount: group.files.length, nodes: [], error: '' };
        try {
          const parser = await getParserFor(langConfig);
          const sources = {};
          for (const f of group.files) {
            const tree = parser.parse(f.content);
            walkNodes(tree, sources, f.path);
            tree.delete();
          }
          entry.nodes = summarizeNodes(sources);

          // Load custom node definitions and derive virtual nodes from raw sources.
          // Definitions with the same name are merged into a single virtual node.
          const customDefs = await loadCustomNodes(langConfig.id);
          const customMerged = new Map();
          for (const def of customDefs) {
            const targetSources = sources[def.node] || [];
            const subs = Array.isArray(def.substring) ? def.substring : [def.substring];
            const matched = targetSources.filter(s => subs.some(sub => s.textLower.includes(sub.toLowerCase())));
            if (matched.length === 0) continue;
            const subDisplay = subs.join(', ');
            if (customMerged.has(def.name)) {
              const existing = customMerged.get(def.name);
              existing.sources.push(...matched);
              existing.count += matched.length;
              existing.node += `, ${def.node}`;
              existing.substring += `, ${subDisplay}`;
            } else {
              customMerged.set(def.name, {
                type: def.name,
                typeLower: def.name.toLowerCase(),
                count: matched.length,
                sources: matched,
                custom: true,
                node: def.node,
                substring: subDisplay,
              });
            }
          }
          for (const cn of customMerged.values()) entry.nodes.push(cn);
        } catch (e) {
          entry.error = e.message || String(e);
        }
        results.push(entry);
      }
      results.sort((a, b) => b.fileCount - a.fileCount);
      return results;
    }

    async function fetchWithRetry(url, signal) {
      for (let attempt = 0; attempt < 2; attempt++) {
        try {
          const res = await fetch(url, { signal });
          if (res.ok) return res;
          if (res.status === 404) return null;
          // non-200, non-404: retry once
        } catch (e) {
          if (e.name === 'AbortError') throw e;
          if (attempt === 1) return null;
        }
      }
      return null;
    }

    // ── Components ─────────────────────────────────────────────────────────────────

    function StatCard({ label, value }) {
      return (
        <div className="bg-white rounded-xl p-4 flex flex-col gap-1 shadow-sm border border-gray-200">
          <span className="text-xs text-gray-500 uppercase tracking-wide">{label}</span>
          <span className="text-2xl font-bold text-gray-800">{value}</span>
        </div>
      );
    }

    function SectionHeading({ children }) {
      return <h2 className="text-lg font-semibold text-gray-900 mb-3 mt-6">{children}</h2>;
    }

    function Section({ title, defaultOpen = true, children }) {
      const [open, setOpen] = useState(defaultOpen);
      return (
        <div>
          <button
            type="button"
            onClick={() => setOpen(o => !o)}
            className="w-full flex items-center gap-2 text-lg font-semibold text-gray-900 mb-3 mt-6 focus:outline-none group"
            aria-expanded={open}
          >
            <span className={`inline-block transition-transform duration-200 text-gray-400 group-hover:text-gray-700 ${open ? 'rotate-90' : ''}`}>▶</span>
            <span>{title}</span>
          </button>
          {open && <div>{children}</div>}
        </div>
      );
    }

    function BarChartCSS({ data, valueKey, labelKey, colors, formatValue }) {
      const max = Math.max(...data.map(d => d[valueKey]), 1);
      return (
        <div className="space-y-2">
          {data.map((d, i) => (
            <div key={d[labelKey]} className="flex items-center gap-2 text-xs">
              <span className="w-24 text-right text-gray-500 truncate flex-shrink-0">{d[labelKey]}</span>
              <div className="flex-1 bg-gray-200 rounded-full h-4 overflow-hidden">
                <div
                  className="h-4 rounded-full transition-all duration-500"
                  style={{
                    width: `${(d[valueKey] / max) * 100}%`,
                    backgroundColor: Array.isArray(colors) ? colors[i % colors.length] : colors,
                  }}
                />
              </div>
              <span className="w-20 text-gray-600 flex-shrink-0">{formatValue ? formatValue(d[valueKey]) : d[valueKey].toLocaleString()}</span>
            </div>
          ))}
        </div>
      );
    }

    const MAX_ITEMS_PER_TYPE = 10;

    function Results({ result, repoInfo, errors, tsResults, tsError }) {
      const { totalFiles, totalLines, totalSize, avgSize, languages, top10, buckets } = result;
      const [nodeQuery, setNodeQuery] = useState('');
      const [debouncedQuery, setDebouncedQuery] = useState('');
      const [showAllTypes, setShowAllTypes] = useState(false);
      const [errorsDismissed, setErrorsDismissed] = useState(false);
      const [activeLangId, setActiveLangId] = useState(tsResults[0]?.id || '');
      const nodeInputRef = useRef(null);
      const [nodeSugIndex, setNodeSugIndex] = useState(-1);
      const nodeSugRef = useRef(null);

      // Scroll selected suggestion into view.
      useEffect(() => {
        if (nodeSugIndex >= 0 && nodeSugRef.current) {
          const item = nodeSugRef.current.children[nodeSugIndex];
          if (item) item.scrollIntoView({ block: 'nearest' });
        }
      }, [nodeSugIndex]);

      useEffect(() => {
        const t = setTimeout(() => setDebouncedQuery(nodeQuery), 150);
        return () => clearTimeout(t);
      }, [nodeQuery]);

      // Reset query and pick a default tab whenever the underlying analysis changes.
      useEffect(() => {
        setNodeQuery('');
        setShowAllTypes(false);
        if (tsResults.length > 0 && !tsResults.some(r => r.id === activeLangId)) {
          setActiveLangId(tsResults[0].id);
        }
      }, [tsResults]);

      const activeLang = tsResults.find(r => r.id === activeLangId) || tsResults[0];
      const tsNodes = activeLang ? activeLang.nodes : [];
      const activeLangError = activeLang ? activeLang.error : '';

      const customNodeTypes = new Set(tsNodes.filter(n => n.custom).map(n => n.type));
      const builtInNodes = tsNodes.filter(n => !n.custom);
      const customNodes = tsNodes.filter(n => n.custom);
      const allNodeTypes = builtInNodes.map(n => n.type);
      const topNodeTypes = showAllTypes ? allNodeTypes : allNodeTypes.slice(0, 15);
      const hiddenCount = allNodeTypes.length - 15;

      // Parse multiple hierarchical type filters from nodeQuery.
      // Format: "type1:type2:…:text" — each segment before the last that matches
      // a known node type becomes a badge; the remainder is the free-text input.
      const badgeTypes = useMemo(() => {
        const parts = nodeQuery.split(':');
        const types = [];
        for (let i = 0; i < parts.length - 1; i++) {
          const part = parts[i].trim();
          if (part && tsNodes.some(n => n.typeLower === part.toLowerCase())) {
            types.push(parts[i]); // keep original casing
          } else {
            break;
          }
        }
        return types;
      }, [nodeQuery, tsNodes]);

      const inputText = badgeTypes.length > 0
        ? nodeQuery.slice(badgeTypes.join(':').length + 1)
        : nodeQuery;

      // Slash-triggered autocomplete for node types.
      const typeSuggestions = useMemo(() => {
        if (!inputText.startsWith('/')) return [];
        const prefix = inputText.slice(1).trim().toLowerCase();
        const matches = tsNodes
          .filter(n => !prefix || n.typeLower.startsWith(prefix))
          .map(n => ({ type: n.type, count: n.count, custom: n.custom }))
          .sort((a, b) => b.count - a.count);
        return matches;
      }, [inputText, tsNodes]);
      const typeSuggestion = typeSuggestions[0]?.type || '';

      const handleInputChange = (e) => {
        const v = e.target.value;
        const prefix = badgeTypes.length > 0 ? badgeTypes.join(':') + ':' : '';
        setNodeQuery(prefix + v);
        setNodeSugIndex(-1);
      };

      const selectNodeSuggestion = (type) => {
        const prefix = badgeTypes.length > 0 ? badgeTypes.join(':') + ':' : '';
        setNodeQuery(prefix + type + ':');
        setNodeSugIndex(-1);
        if (nodeInputRef.current) nodeInputRef.current.focus();
      };

      const handleNodeQueryKeyDown = (e) => {
        // Dropdown navigation when slash-suggestions are open
        if (typeSuggestions.length > 0) {
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            setNodeSugIndex(i => Math.min(i + 1, typeSuggestions.length - 1));
            return;
          }
          if (e.key === 'ArrowUp') {
            e.preventDefault();
            setNodeSugIndex(i => Math.max(i - 1, -1));
            return;
          }
          if (e.key === 'Enter' && nodeSugIndex >= 0) {
            e.preventDefault();
            selectNodeSuggestion(typeSuggestions[nodeSugIndex].type);
            return;
          }
          if (e.key === 'Tab' && typeSuggestion) {
            e.preventDefault();
            selectNodeSuggestion(typeSuggestion);
            return;
          }
          if (e.key === 'Escape') {
            e.preventDefault();
            // Dismiss the dropdown but keep existing badges intact
            const prefix = badgeTypes.length > 0 ? badgeTypes.join(':') + ':' : '';
            setNodeQuery(prefix);
            setNodeSugIndex(-1);
            return;
          }
        }
        // Backspace at cursor position 0 removes the last badge
        if (
          e.key === 'Backspace' &&
          badgeTypes.length > 0 &&
          e.target.selectionStart === 0 &&
          e.target.selectionEnd === 0
        ) {
          e.preventDefault();
          const remaining = badgeTypes.slice(0, -1);
          const prefix = remaining.length > 0 ? remaining.join(':') + ':' : '';
          setNodeQuery(prefix + inputText);
        }
      };

      const removeBadge = (index) => {
        const remaining = badgeTypes.filter((_, i) => i !== index);
        const prefix = remaining.length > 0 ? remaining.join(':') + ':' : '';
        setNodeQuery(prefix + inputText);
        if (nodeInputRef.current) nodeInputRef.current.focus();
      };

      const bucketData = BUCKET_ORDER.map(b => ({ name: b, count: buckets[b] || 0 }));

      const highlight = (text, q) => {
        if (!q) return text;
        const lower = text.toLowerCase();
        const parts = [];
        let i = 0;
        while (i < text.length) {
          const idx = lower.indexOf(q, i);
          if (idx === -1) {
            parts.push(text.slice(i));
            break;
          }
          if (idx > i) parts.push(text.slice(i, idx));
          parts.push(<mark key={idx} className="bg-yellow-200 text-gray-900 rounded px-0.5">{text.slice(idx, idx + q.length)}</mark>);
          i = idx + q.length;
        }
        return parts;
      };

      // Map our tree-sitter language ids to highlight.js language names.
      const HLJS_LANG = { javascript: 'javascript', typescript: 'typescript', tsx: 'typescript', python: 'python' };

      // Syntax-highlight `code` for `langId` and additionally wrap occurrences of
      // `query` (case-insensitive) with <mark>. Returns an HTML string safe to
      // inject via dangerouslySetInnerHTML — query is matched against text nodes
      // only, so we never break syntax-highlight tags.
      const highlightCode = (code, langId, query) => {
        const hljsLang = HLJS_LANG[langId];
        let html;
        if (hljsLang && window.hljs && window.hljs.getLanguage(hljsLang)) {
          try {
            html = window.hljs.highlight(code, { language: hljsLang, ignoreIllegals: true }).value;
          } catch {
            html = escapeHtml(code);
          }
        } else {
          html = escapeHtml(code);
        }
        if (!query) return html;
        const container = document.createElement('div');
        container.innerHTML = html;
        const lowerQ = query.toLowerCase();
        const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null);
        const textNodes = [];
        let n;
        while ((n = walker.nextNode())) textNodes.push(n);
        for (const node of textNodes) {
          const text = node.nodeValue;
          const lower = text.toLowerCase();
          let i = 0, idx;
          if ((idx = lower.indexOf(lowerQ)) === -1) continue;
          const frag = document.createDocumentFragment();
          while (idx !== -1) {
            if (idx > i) frag.appendChild(document.createTextNode(text.slice(i, idx)));
            const mark = document.createElement('mark');
            mark.className = 'bg-yellow-200 text-gray-900 rounded px-0.5';
            mark.textContent = text.slice(idx, idx + query.length);
            frag.appendChild(mark);
            i = idx + query.length;
            idx = lower.indexOf(lowerQ, i);
          }
          if (i < text.length) frag.appendChild(document.createTextNode(text.slice(i)));
          node.parentNode.replaceChild(frag, node);
        }
        return container.innerHTML;
      };

      const escapeHtml = (s) => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      const filteredNodes = useMemo(() => {
        const raw = debouncedQuery.trim().toLowerCase();
        if (!raw) {
          return tsNodes.map(n => {
            const first = n.sources[0] || { text: '', file: '' };
            return { ...n, items: [first], matches: n.count };
          });
        }
        const { filterTypes, textQ } = GhMinerCore.parseHierarchicalQuery(raw, tsNodes);
        return GhMinerCore.applyTsNodeFilter(tsNodes, filterTypes, textQ, MAX_ITEMS_PER_TYPE);
      }, [tsNodes, debouncedQuery]);

      return (
        <div className="w-full max-w-4xl mx-auto pb-16 bg-gray-50 rounded-xl p-6">
          {repoInfo && (
            <div className="mb-4 flex items-center gap-3">
              <LangIcon name={repoInfo.user} className="text-3xl" />
              <a
                href={`https://github.com/${repoInfo.user}/${repoInfo.repo}`}
                target="_blank"
                rel="noopener noreferrer"
                className="text-xl font-semibold text-gray-800 hover:text-accent transition-colors"
              >
                <span className="text-gray-500">{repoInfo.user}</span>
                <span className="text-gray-400 mx-1">/</span>
                <span>{repoInfo.repo}</span>
              </a>
            </div>
          )}
          <Section title="Overview" defaultOpen={false}>
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <StatCard label="Files" value={totalFiles.toLocaleString()} />
              <StatCard label="Lines of Code" value={totalLines.toLocaleString()} />
              <StatCard label="Total Size" value={formatSize(totalSize)} />
              <StatCard label="Languages" value={languages.length} />
            </div>
          </Section>

          <Section title="Language Breakdown" defaultOpen={false}>
            <div className="bg-white rounded-xl overflow-hidden shadow-sm border border-gray-200">
              <table className="w-full text-sm">
                <thead>
                  <tr className="text-gray-500 text-xs uppercase border-b border-gray-200 bg-gray-50">
                    <th className="text-left px-4 py-3">Language</th>
                    <th className="text-right px-4 py-3">Files</th>
                    <th className="text-right px-4 py-3">Lines</th>
                    <th className="text-right px-4 py-3">%</th>
                  </tr>
                </thead>
                <tbody>
                  {languages.map((l) => (
                    <tr key={l.lang} className="border-b border-gray-100 hover:bg-gray-50/60">
                      <td className="px-4 py-2 flex items-center gap-2 text-gray-700">
                        <LangIcon name={l.lang} className="text-base flex-shrink-0 w-4 text-center" />
                        {l.lang}
                      </td>
                      <td className="text-right px-4 py-2 text-gray-600">{l.files.toLocaleString()}</td>
                      <td className="text-right px-4 py-2 text-gray-600">{l.lines.toLocaleString()}</td>
                      <td className="text-right px-4 py-2 text-gray-500">{l.pct}%</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </Section>

          <Section title="File Size Distribution" defaultOpen={false}>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div className="bg-white rounded-xl p-4 shadow-sm border border-gray-200">
                <p className="text-xs text-gray-500 mb-3">Files by size bucket</p>
                <BarChartCSS
                  data={bucketData}
                  valueKey="count"
                  labelKey="name"
                  colors="#FE4A60"
                  formatValue={v => `${v} files`}
                />
              </div>
              <div className="bg-white rounded-xl p-4 shadow-sm border border-gray-200">
                <p className="text-xs text-gray-500 mb-3">Average file size: <span className="text-gray-800 font-medium">{formatSize(avgSize)}</span></p>
                <p className="text-xs text-gray-500 mb-2">Largest files (top 10)</p>
                <ol className="space-y-1">
                  {top10.map((f, i) => (
                    <li key={f.path} className="flex justify-between text-xs">
                      <span className="text-gray-700 truncate max-w-[70%]" title={f.path}>
                        <span className="text-gray-400 mr-1">{i + 1}.</span>{f.path.split('/').pop()}
                      </span>
                      <span className="text-gray-500 ml-2 flex-shrink-0">{formatSize(f.size)}</span>
                    </li>
                  ))}
                </ol>
              </div>
            </div>
          </Section>

          {tsError && (
            <div className="mt-6 bg-yellow-50 border border-yellow-200 rounded-xl p-4">
              <p className="text-yellow-700 text-sm">{tsError}</p>
            </div>
          )}

          {tsResults.length > 0 && (
            <Section title="AST Node Types (tree-sitter)">
              {tsResults.length > 1 && (
                <div className="flex flex-wrap gap-1.5 mb-3">
                  {tsResults.map(r => {
                    const active = r.id === activeLang?.id;
                    return (
                      <button
                        key={r.id}
                        type="button"
                        onClick={() => setActiveLangId(r.id)}
                        className={`px-3 py-1 text-xs font-medium rounded-full border transition-colors inline-flex items-center gap-1.5 ${active
                            ? 'bg-slate-700 text-white border-slate-700 hover:bg-slate-800'
                            : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100 hover:border-slate-300'
                          }`}
                      >
                        <LangIcon name={r.label} className="text-sm" />
                        {r.label} <span className={active ? 'text-slate-300' : 'text-slate-400'}>({r.fileCount})</span>
                      </button>
                    );
                  })}
                </div>
              )}
              {activeLangError && (
                <div className="mb-3 bg-yellow-50 border border-yellow-200 rounded-xl p-3">
                  <p className="text-yellow-700 text-xs">Failed to parse {activeLang.label}: {activeLangError}</p>
                </div>
              )}
              {tsNodes.length === 0 ? (
                <div className="bg-white rounded-xl p-4 shadow-sm border border-gray-200 text-xs text-gray-400">
                  No nodes parsed for {activeLang?.label}.
                </div>
              ) : (
                <>
                  <div
                    onClick={() => nodeInputRef.current && nodeInputRef.current.focus()}
                    className="relative w-full bg-white border border-gray-300 rounded-lg pl-2 pr-4 py-1.5 text-sm flex items-center gap-1.5 focus-within:border-gray-500 focus-within:ring-1 focus-within:ring-gray-500 cursor-text"
                  >
                    {badgeTypes.map((bt, idx) => (
                      <span
                        key={idx}
                        className={`flex items-center gap-1 pl-2 pr-1 py-0.5 rounded-full text-[11px] font-mono flex-shrink-0 ${customNodeTypes.has(bt) ? 'bg-amber-500 text-white' : 'bg-indigo-600 text-white'}`}
                      >
                        {bt}
                        <button
                          type="button"
                          onClick={(e) => { e.stopPropagation(); removeBadge(idx); }}
                          className="w-3.5 h-3.5 flex items-center justify-center rounded-full hover:bg-white/25 leading-none text-[11px]"
                          aria-label="Remove node type filter"
                        >
                          ×
                        </button>
                      </span>
                    ))}
                    <input
                      ref={nodeInputRef}
                      type="text"
                      value={inputText}
                      onChange={handleInputChange}
                      onKeyDown={handleNodeQueryKeyDown}
                      onBlur={() => setTimeout(() => {
                        // Close dropdown by stripping any uncommitted /… input, keeping badges
                        if (inputText.startsWith('/')) {
                          const prefix = badgeTypes.length > 0 ? badgeTypes.join(':') + ':' : '';
                          setNodeQuery(prefix);
                        }
                        setNodeSugIndex(-1);
                      }, 150)}
                      placeholder={badgeTypes.length > 0 ? 'Filter text or type / to add another node type…' : 'Search text or type / to filter by node type…'}
                      className="flex-1 min-w-0 bg-transparent text-gray-800 placeholder-gray-400 focus:outline-none px-1 py-0.5"
                    />
                    {typeSuggestions.length > 0 && (
                      <ul
                        ref={nodeSugRef}
                        className="absolute z-20 left-0 right-0 top-full mt-1 bg-white border border-gray-300 rounded-lg shadow-lg overflow-auto max-h-64 text-sm"
                      >
                        {typeSuggestions.map((s, i) => (
                          <li
                            key={s.type}
                            className={`px-3 py-1.5 cursor-pointer font-mono text-xs flex items-center justify-between gap-3 ${i === nodeSugIndex ? 'bg-gray-100 text-gray-900' : 'text-gray-700 hover:bg-gray-50'}`}
                            onMouseDown={() => selectNodeSuggestion(s.type)}
                          >
                            <span className="flex items-center gap-2">
                              <span className={`text-[10px] ${s.custom ? 'text-amber-500' : 'text-gray-400'}`}>/</span>
                              {s.type}
                              {s.custom && <span className="text-[9px] font-sans font-medium bg-amber-100 text-amber-600 px-1.5 py-0.5 rounded-full leading-none">custom</span>}
                            </span>
                            <span className="text-gray-400 text-[10px]">{s.count}</span>
                          </li>
                        ))}
                      </ul>
                    )}
                  </div>
                  {customNodes.length > 0 && (
                    <div className="flex flex-wrap items-center gap-1.5 mt-2">
                      <span className="text-[10px] font-medium text-amber-600">Custom Nodes:</span>
                      {customNodes.map(n => {
                        const active = badgeTypes.some(bt => bt.toLowerCase() === n.type.toLowerCase());
                        return (
                          <button
                            key={`custom-${n.type}`}
                            type="button"
                            onClick={() => {
                              if (active) {
                                const remaining = badgeTypes.filter(bt => bt.toLowerCase() !== n.type.toLowerCase());
                                const prefix = remaining.length > 0 ? remaining.join(':') + ':' : '';
                                setNodeQuery(prefix + inputText);
                              } else {
                                const prefix = badgeTypes.length > 0 ? badgeTypes.join(':') + ':' : '';
                                setNodeQuery(prefix + n.type + ':');
                              }
                              if (nodeInputRef.current) nodeInputRef.current.focus();
                            }}
                            className={`px-2 py-0.5 text-[10px] font-mono rounded-full border transition-colors ${active
                                ? 'bg-amber-500 text-white border-amber-500 hover:bg-amber-600'
                                : 'bg-amber-50 text-amber-600 border-amber-200 hover:bg-amber-100 hover:border-amber-300'
                              }`}
                            title={`Custom: ${n.node} containing "${n.substring}"`}
                          >
                            {n.type}
                          </button>
                        );
                      })}
                    </div>
                  )}
                  <div className="flex flex-wrap items-center gap-1.5 mt-1.5 mb-3">
                    <span className="text-[10px] font-medium text-indigo-600">Language Nodes:</span>
                    {topNodeTypes.map(t => {
                      const active = badgeTypes.some(bt => bt.toLowerCase() === t.toLowerCase());
                      return (
                        <button
                          key={t}
                          type="button"
                          onClick={() => {
                            if (active) {
                              const remaining = badgeTypes.filter(bt => bt.toLowerCase() !== t.toLowerCase());
                              const prefix = remaining.length > 0 ? remaining.join(':') + ':' : '';
                              setNodeQuery(prefix + inputText);
                            } else {
                              const prefix = badgeTypes.length > 0 ? badgeTypes.join(':') + ':' : '';
                              setNodeQuery(prefix + t + ':');
                            }
                            if (nodeInputRef.current) nodeInputRef.current.focus();
                          }}
                          className={`px-2 py-0.5 text-[10px] font-mono rounded-full border transition-colors ${active
                              ? 'bg-indigo-600 text-white border-indigo-600 hover:bg-indigo-700'
                              : 'bg-indigo-50 text-indigo-600 border-indigo-200 hover:bg-indigo-100 hover:border-indigo-300'
                            }`}
                        >
                          {t}
                        </button>
                      );
                    })}
                    {hiddenCount > 0 && (
                      <button
                        type="button"
                        onClick={() => setShowAllTypes(s => !s)}
                        className="px-2 py-0.5 text-[10px] font-mono rounded-full border border-gray-300 bg-white text-accent hover:bg-gray-50 hover:border-gray-400 transition-colors"
                      >
                        {showAllTypes ? '− less' : `+ ${hiddenCount} more`}
                      </button>
                    )}
                  </div>
                  <div className="bg-white rounded-xl overflow-hidden shadow-sm border border-gray-200">
                    <table className="w-full text-sm table-fixed">
                      <thead>
                        <tr className="text-gray-500 text-xs uppercase border-b border-gray-200 bg-gray-50">
                          <th className="text-left px-4 py-3 w-56">Node Type</th>
                          <th className="text-right px-4 py-3 w-24">Count</th>
                          <th className="text-left px-4 py-3">{debouncedQuery.trim() ? 'Results' : 'Examples'}</th>
                        </tr>
                      </thead>
                      <tbody>
                        {filteredNodes.map(({ type, count, items, matches, custom, substring }) => {
                          const raw = debouncedQuery.trim().toLowerCase();
                          const colon = raw.indexOf(':');
                          const textQ = colon !== -1 ? raw.slice(colon + 1).trim() : raw;
                          // For custom nodes, highlight the defining substring when no text search is active.
                          const customSub = custom && substring ? substring.split(',')[0].trim().toLowerCase() : '';
                          const q = textQ || customSub;
                          const displayCount = raw ? matches : count;
                          const truncated = !!raw && matches > items.length;
                          const uniqueShown = new Set(items.map(it => `${it.file || ''}\0${it.text || ''}`)).size;
                          const isCustom = custom || customNodeTypes.has(type);
                          return (
                            <tr key={type} className={`border-b border-gray-100 align-top ${isCustom ? 'hover:bg-amber-50/60' : 'hover:bg-gray-50/60'}`}>
                              <td className={`px-4 py-2 font-mono text-xs break-all ${isCustom ? 'text-violet-700' : 'text-gray-700'}`}>
                                {type}
                                {isCustom && <span className="ml-1.5 text-[9px] font-sans text-amber-500 bg-amber-50 border border-amber-100 rounded-full px-1.5 py-px align-middle">custom</span>}
                              </td>
                              <td className="text-right px-4 py-2 text-gray-600">{displayCount.toLocaleString()}</td>
                              <td className="px-4 py-2 font-mono text-gray-600 text-xs">
                                {truncated && (
                                  <div className="text-[10px] text-gray-400 mb-1">
                                    Showing first {uniqueShown.toLocaleString()} of {matches.toLocaleString()} matches
                                  </div>
                                )}
                                <div className="divide-y divide-gray-200 max-h-96 overflow-y-auto">
                                  {(() => {
                                    const groups = [];
                                    const idx = new Map();
                                    for (const it of items) {
                                      const key = it.file || '';
                                      if (!idx.has(key)) {
                                        idx.set(key, groups.length);
                                        groups.push({ file: key, texts: [], seen: new Set() });
                                      }
                                      const g = groups[idx.get(key)];
                                      const t = it.text || '';
                                      if (!g.seen.has(t)) {
                                        g.seen.add(t);
                                        g.texts.push(t);
                                      }
                                    }
                                    groups.sort((a, b) => b.texts.length - a.texts.length);
                                    return groups.map((g, gi) => (
                                      <div key={gi} className="py-2 first:pt-0 last:pb-0">
                                        {g.file && (
                                          <div className="flex items-center gap-1.5 mb-1.5">
                                            <span className="text-gray-700 text-[10px] font-semibold truncate" title={g.file}>
                                              {g.file}
                                            </span>
                                            {g.texts.length > 1 && (
                                              <span className="text-[9px] text-gray-500 bg-gray-100 border border-gray-200 rounded-full px-1.5 py-px flex-shrink-0">
                                                {g.texts.length}
                                              </span>
                                            )}
                                          </div>
                                        )}
                                        <div className="flex flex-col gap-1">
                                          {g.texts.map((text, ti) => {
                                            const truncated = text.length > 200 ? text.slice(0, 200) + '…' : text;
                                            return (
                                              <pre
                                                key={ti}
                                                className="hljs whitespace-pre-wrap break-all border border-gray-200 rounded px-2 py-1 font-mono"
                                                title={text}
                                                dangerouslySetInnerHTML={{ __html: highlightCode(truncated, activeLang?.id, q) }}
                                              />
                                            );
                                          })}
                                        </div>
                                      </div>
                                    ));
                                  })()}
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                        {filteredNodes.length === 0 && (
                          <tr>
                            <td colSpan="3" className="px-4 py-4 text-center text-xs text-gray-400">No matches</td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </>
              )}
            </Section>
          )}

          {errors.length > 0 && !errorsDismissed && (
            <div className="mt-6 bg-red-50 border border-red-200 rounded-xl p-4 relative">
              <button
                onClick={() => setErrorsDismissed(true)}
                aria-label="Dismiss"
                className="absolute top-2 right-2 text-red-400 hover:text-red-600 text-lg leading-none px-2 py-0.5"
              >
                ×
              </button>
              <p className="text-red-600 text-sm font-medium mb-2 pr-6">Failed to fetch {errors.length} file(s):</p>
              <ul className="text-xs text-red-400 space-y-0.5 max-h-32 overflow-y-auto">
                {errors.map(e => <li key={e} className="font-mono">{e}</li>)}
              </ul>
            </div>
          )}
        </div>
      );
    }

    // ── Main App ───────────────────────────────────────────────────────────────────

    function App() {
      const [url, setUrl] = useState('');
      const [phase, setPhase] = useState('input'); // input | loading | parsing | results
      const [progress, setProgress] = useState({ done: 0, total: 0 });
      const [result, setResult] = useState(null);
      const [repoInfo, setRepoInfo] = useState(null);
      const [errors, setErrors] = useState([]);
      const [error, setError] = useState('');
      const [tsResults, setTsResults] = useState([]);
      const [tsError, setTsError] = useState('');
      const abortRef = useRef(null);
      const [repoList, setRepoList] = useState([]);
      const [suggestions, setSuggestions] = useState([]);
      const [suggestionIndex, setSuggestionIndex] = useState(-1);
      const suggestionsRef = useRef(null);

      useEffect(() => {
        fetch('data/repos.csv')
          .then(r => r.text())
          .then(text => {
            const repos = text.trim().split('\n').slice(1).map(line => {
              const parts = line.split(',');
              return { name: parts[0].trim(), language: (parts[1] || '').trim() };
            }).filter(r => r.name);
            setRepoList(repos);
          })
          .catch(() => { });
      }, []);

      const handleAnalyze = useCallback(async (urlOverride) => {
        setError('');

        const targetUrl = typeof urlOverride === 'string' ? urlOverride : url;
        const parsed = parseRepoUrl(targetUrl);
        if (!parsed) {
          setError('Invalid GitHub URL. Expected format: https://github.com/user/repo');
          return;
        }

        const { user, repo } = parsed;
        const version = 'master';

        // Reflect the repo in the URL hash so the page is shareable.
        // Use replaceState to avoid triggering the hashchange listener below.
        const newHash = `#${user}/${repo}`;
        if (window.location.hash !== newHash) {
          history.replaceState(null, '', newHash);
        }

        abortRef.current = new AbortController();
        const signal = abortRef.current.signal;

        setPhase('loading');
        setProgress({ done: 0, total: 0 });

        // Step 1: list files
        let fileTree;
        try {
          const listUrl = `https://data.jsdelivr.com/v1/packages/gh/${user}/${repo}@${version}`;
          const res = await fetch(listUrl, { signal });
          if (!res.ok) {
            setPhase('input');
            setError('Repo not found, too large, or not public (listing failed).');
            return;
          }
          const json = await res.json();
          fileTree = flattenTree(json.files || []);
        } catch (e) {
          if (e.name !== 'AbortError') {
            setPhase('input');
            setError('Network error while listing repo files.');
          } else {
            setPhase('input');
          }
          return;
        }

        // Step 2: filter source files
        const sourceFiles = fileTree.filter(f => SOURCE_EXTENSIONS.has(extOf(f.path)));
        if (sourceFiles.length === 0) {
          setPhase('input');
          setError('No source files found in this repo.');
          return;
        }

        setProgress({ done: 0, total: sourceFiles.length });

        // Step 3: fetch each file
        const fetched = [];
        const failed = [];
        let done = 0;

        const tasks = sourceFiles.map(f => async () => {
          if (signal.aborted) return null;
          const fileUrl = `https://cdn.jsdelivr.net/gh/${user}/${repo}@${version}/${f.path}`;
          try {
            const res = await fetchWithRetry(fileUrl, signal);
            if (res) {
              const content = await res.text();
              return { path: f.path, size: f.size || content.length, content };
            } else {
              failed.push(f.path);
              return null;
            }
          } catch (e) {
            if (e.name !== 'AbortError') failed.push(f.path);
            return null;
          }
        });

        await withConcurrency(tasks, CONCURRENCY, (i, r) => {
          if (r) fetched.push(r);
          done++;
          setProgress({ done, total: sourceFiles.length });
        });

        if (signal.aborted) {
          setPhase('input');
          return;
        }

        if (fetched.length === 0) {
          setPhase('input');
          setError('All file fetches failed. Try again or check the repo.');
          return;
        }

        const analysisResult = analyze(fetched);

        // Step 4: tree-sitter AST analysis on every supported language
        const parseable = fetched.filter(f => tsLangForPath(f.path));
        let results = [];
        let tsErr = '';
        if (parseable.length > 0) {
          setPhase('parsing');
          try {
            results = await analyzeTreeSitter(parseable);
          } catch (e) {
            tsErr = `Tree-sitter analysis failed: ${e.message}`;
          }
        }

        setResult(analysisResult);
        setRepoInfo({ user, repo });
        setErrors(failed);
        setTsResults(results);
        setTsError(tsErr);
        setPhase('results');
      }, [url]);

      const handleCancel = () => {
        abortRef.current?.abort();
      };

      const handleHome = () => {
        abortRef.current?.abort();
        history.replaceState(null, '', window.location.pathname + window.location.search);
        setUrl('');
        setError('');
        setResult(null);
        setRepoInfo(null);
        setErrors([]);
        setTsResults([]);
        setTsError('');
        setSuggestions([]);
        setSuggestionIndex(-1);
        setPhase('input');
      };

      // Load repo from URL hash (#owner/repo) on mount and on back/forward navigation.
      // handleAnalyze is held in a ref so this effect runs only once and doesn't
      // re-fire on every keystroke (which would loop analysis).
      const handleAnalyzeRef = useRef(handleAnalyze);
      useEffect(() => { handleAnalyzeRef.current = handleAnalyze; });
      useEffect(() => {
        const loadFromHash = () => {
          const hash = window.location.hash.replace(/^#/, '');
          if (!hash) return;
          const parsed = parseRepoUrl(hash);
          if (!parsed) return;
          const fullUrl = `https://github.com/${parsed.user}/${parsed.repo}`;
          setUrl(fullUrl);
          handleAnalyzeRef.current(fullUrl);
        };
        loadFromHash();
        window.addEventListener('hashchange', loadFromHash);
        return () => window.removeEventListener('hashchange', loadFromHash);
      }, []);

      const inputBlock = (
        <div className="w-full max-w-2xl mb-6">
          <div className="flex gap-2 relative">
            <div className="flex-1 relative">
              <input
                className="w-full bg-white border border-gray-300 rounded-lg px-4 py-2.5 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500"
                placeholder="https://github.com/user/repo"
                value={url}
                onChange={e => {
                  const val = e.target.value;
                  setUrl(val);
                  setError('');
                  setSuggestionIndex(-1);
                  if (val.length < 2) { setSuggestions([]); return; }
                  const q = val.replace(/^https?:\/\/github\.com\//i, '').toLowerCase();
                  const matches = repoList.filter(r => r.name.toLowerCase().includes(q)).slice(0, 8);
                  setSuggestions(matches);
                }}
                onKeyDown={e => {
                  if (suggestions.length > 0) {
                    if (e.key === 'ArrowDown') {
                      e.preventDefault();
                      setSuggestionIndex(i => Math.min(i + 1, suggestions.length - 1));
                      return;
                    }
                    if (e.key === 'ArrowUp') {
                      e.preventDefault();
                      setSuggestionIndex(i => Math.max(i - 1, -1));
                      return;
                    }
                    if (e.key === 'Enter' && suggestionIndex >= 0) {
                      e.preventDefault();
                      setUrl('https://github.com/' + suggestions[suggestionIndex].name);
                      setSuggestions([]);
                      setSuggestionIndex(-1);
                      return;
                    }
                    if (e.key === 'Escape') { setSuggestions([]); setSuggestionIndex(-1); return; }
                  }
                  if (e.key === 'Enter') handleAnalyze();
                }}
                onBlur={() => setTimeout(() => setSuggestions([]), 150)}
                disabled={phase === 'loading'}
              />
              {suggestions.length > 0 && (
                <ul ref={suggestionsRef} className="absolute z-10 left-0 right-0 top-full mt-1 bg-white border border-gray-300 rounded-lg shadow-lg overflow-hidden text-sm">
                  {suggestions.map((s, i) => (
                    <li
                      key={s.name}
                      className={`px-4 py-2 cursor-pointer font-mono text-xs flex items-center justify-between gap-3 ${i === suggestionIndex ? 'bg-gray-100 text-gray-900' : 'text-gray-700 hover:bg-gray-50'}`}
                      onMouseDown={() => {
                        setUrl('https://github.com/' + s.name);
                        setSuggestions([]);
                        setSuggestionIndex(-1);
                      }}
                    >
                      <span>{s.name}</span>
                      {s.language && (
                        <span className="text-gray-400 font-sans flex-shrink-0 inline-flex items-center gap-1.5">
                          {s.language}
                          <LangIcon name={s.language} className="text-base" />
                        </span>
                      )}
                    </li>
                  ))}
                </ul>
              )}
            </div>
            <button
              onClick={handleAnalyze}
              className="bg-gray-900 hover:bg-gray-800 text-white font-medium px-5 py-2.5 rounded-lg text-sm transition-colors"
            >
              Analyze
            </button>
          </div>
          {error && <p className="text-red-400 text-xs mt-2 ml-1">{error}</p>}
        </div>
      );

      return (
        <div className="min-h-screen bg-white flex flex-col items-center px-4 pt-2">
          {/* Home button */}
          {/* Top bar: home + GitHub link, centered */}
          <div className="flex items-center gap-2 mb-12">
            <button
              onClick={handleHome}
              title="Home"
              aria-label="Home"
              className="inline-flex items-center gap-2 bg-white hover:bg-gray-50 border border-gray-300 text-gray-700 hover:text-accent rounded-lg px-3 py-2 shadow-sm transition-colors text-sm font-medium"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M3 12L12 3l9 9" />
                <path d="M5 10v10h14V10" />
              </svg>
              Home
            </button>
            <a
              href="https://github.com/andrehora/ghminer"
              target="_blank"
              rel="noopener noreferrer"
              title="ghminer on GitHub"
              className="inline-flex items-center gap-2 bg-white hover:bg-gray-50 border border-gray-300 text-gray-700 hover:text-accent rounded-lg px-3 py-2 shadow-sm transition-colors text-sm font-medium"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56 0-.27-.01-1-.02-1.96-3.2.69-3.87-1.54-3.87-1.54-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.05 11.05 0 0 1 5.79 0c2.21-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.69 5.41-5.25 5.69.41.36.78 1.06.78 2.14 0 1.55-.01 2.8-.01 3.18 0 .31.21.67.8.56C20.71 21.39 24 17.08 24 12 24 5.65 18.85.5 12 .5z" />
              </svg>
              ghminer
            </a>
          </div>

          {/* Header */}
          <div className="mb-8 text-center">
            <h1 className="text-4xl sm:text-5xl md:text-6xl font-extrabold text-gray-900 tracking-tight">
              <span className="text-accent">gh</span>miner
            </h1>
            <p className="text-gray-500 text-base mt-2">Analyze GitHub repositories</p>
          </div>

          {/* Input */}
          {(phase === 'input' || phase === 'results') && inputBlock}

          {/* Loading */}
          {(phase === 'loading' || phase === 'parsing') && (
            <div className="w-full max-w-md flex flex-col items-center gap-4 mt-16">
              {phase === 'loading' ? (
                <>
                  <p className="text-gray-700 text-sm">
                    Fetching {progress.done.toLocaleString()} / {progress.total.toLocaleString()} files…
                  </p>
                  <div className="w-full bg-gray-200 rounded-full h-2.5 overflow-hidden">
                    <div
                      className="bg-accent h-2.5 rounded-full transition-all duration-200"
                      style={{ width: progress.total > 0 ? `${(progress.done / progress.total) * 100}%` : '0%' }}
                    />
                  </div>
                </>
              ) : (
                <p className="text-gray-700 text-sm">Parsing source files with tree-sitter…</p>
              )}
              <button
                onClick={handleCancel}
                className="text-gray-500 hover:text-gray-900 text-sm transition-colors"
              >
                Cancel
              </button>
            </div>
          )}

          {/* Results */}
          {phase === 'results' && result && (
            <Results result={result} repoInfo={repoInfo} errors={errors} tsResults={tsResults} tsError={tsError} />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
